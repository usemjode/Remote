<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Remote Control</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131a26;
            --accent-blue: #3b82f6;
            --text-main: #ffffff;
            --text-muted: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --border: #1e293b;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            box-sizing: border-box;
        }

        /* Network Status Header Layout */
        .dashboard-header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 24px;
        }

        .network-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .network-badge.offline {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .pulse {
            width: 8px;
            height: 8px;
            background-color: currentColor;
            border-radius: 50%;
            animation: pulse-animation 1.8s infinite;
        }

        @keyframes pulse-animation {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }

        .conn-details {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .highlight {
            color: var(--text-main);
            font-weight: 600;
            font-family: monospace;
            background-color: #1e293b;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Status & Terminal Logs box */
        .log-box {
            background-color: #070a10;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            font-family: monospace;
            font-size: 13px;
            color: var(--accent-blue);
            text-align: left;
            margin-bottom: 24px;
            min-height: 40px;
            display: flex;
            align-items: center;
        }

        /* Grid Controls */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            background-color: var(--border);
            color: var(--text-main);
            border: 1px solid transparent;
            padding: 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:active {
            transform: scale(0.97);
            background-color: #243247;
        }

        .btn-primary {
            background-color: var(--accent-blue);
            grid-column: span 2;
            padding: 24px;
            font-size: 18px;
        }

        .btn-primary:active {
            background-color: #2563eb;
        }

        .btn-danger {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .btn-danger:active {
            background-color: rgba(239, 68, 68, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="dashboard-header">
            <div id="status-badge" class="network-badge offline">
                <div class="pulse"></div>
                <span id="badge-text">DISCONNECTED</span>
            </div>
            
            <div class="conn-details">
                Target Server: <span id="info-ip" class="highlight">Offline</span><br>
                Active Session Port: <span id="info-port" class="highlight">None</span>
            </div>
        </div>

        <div id="log-box" class="log-box">
            [SYS]: Awaiting synchronization link from Discord...
        </div>

        <div class="controls-grid">
            <button class="btn btn-primary" onclick="sendCommand('next')">NEXT SLIDE</button>
            <button class="btn" onclick="sendCommand('previous')">PREVIOUS</button>
            <button class="btn btn-danger" onclick="sendCommand('blackout')">BLACKOUT</button>
        </div>
    </div>

    <script>
        // ================= CONFIGURATION =================
        const COMPUTER_IP = "192.168.1.100"; // Put your computer's local network IP here
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1515395624143425677/fMSyb5HE-fQcbRhZdtEGxo2Tz9md5jtm684dkRq7x_56jgfirKK4_w3oWPD4IUj7Y8_l";
        // =================================================

        let activePort = "";
        let commandUrl = "";

        async function listenToWebhook() {
            const badge = document.getElementById('status-badge');
            const badgeText = document.getElementById('badge-text');
            const infoIp = document.getElementById('info-ip');
            const infoPort = document.getElementById('info-port');
            const logBox = document.getElementById('log-box');

            try {
                // Fetch the webhook data directly
                const response = await fetch(DISCORD_WEBHOOK_URL);
                if (!response.ok) throw new Error("Unreachable");

                const data = await response.json();
                
                // Read the current name of the webhook
                const currentName = data.name.trim();
                
                // Look for a 4-digit port number anywhere in the webhook name
                const portMatch = currentName.match(/\d{4}/);

                if (portMatch) {
                    activePort = portMatch[0];
                    commandUrl = `http://${COMPUTER_IP}:${activePort}/api/remote`;

                    // Update UI Elements to reflect connection status
                    badge.className = "network-badge";
                    badgeText.innerText = "ONLINE";
                    infoIp.innerText = COMPUTER_IP;
                    infoPort.innerText = activePort;
                    logBox.innerText = `[SYS]: Connected. Port structure [${activePort}] is linked and listening.`;
                    logBox.style.color = "var(--success)";
                } else {
                    logBox.innerText = `[SYS]: Webhook read successful, but name "${currentName}" contains no active port code.`;
                }

            } catch (err) {
                badge.className = "network-badge offline";
                badgeText.innerText = "ERROR";
                logBox.innerText = "[ERR]: Cross-origin sync check failed. Verify configuration.";
                logBox.style.color = "var(--danger)";
            }
        }

        function sendCommand(action) {
            const logBox = document.getElementById('log-box');
            if (!activePort) {
                logBox.innerText = "[ERR]: Command dropped. No active port connection established.";
                logBox.style.color = "var(--danger)";
                return;
            }

            logBox.innerText = `[TX]: Dispatching payload event: "${action.toUpperCase()}"...`;
            logBox.style.color = "var(--accent-blue)";

            fetch(commandUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: action })
            })
            .then(res => {
                if (res.ok) {
                    logBox.innerText = `[SUCCESS]: Command "${action.toUpperCase()}" executed by local server.`;
                    logBox.style.color = "var(--success)";
                }
            })
            .catch(() => {
                logBox.innerText = `[ERR]: Local port connection broken. Computer offline on network?`;
                logBox.style.color = "var(--danger)";
            });
        }

        // Run the checker instantly on page load, and check for port updates automatically every 3 seconds
        window.onload = () => {
            listenToWebhook();
            setInterval(listenToWebhook, 3000);
        };
    </script>
</body>
</html>
