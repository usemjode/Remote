<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentation Remote</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --error-color: #ff6b6b;
            --success-color: #2ecc71;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .card {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* Pure text title with no background highlights */
        .title {
            font-size: 42px;
            font-weight: 500;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .status {
            font-size: 16px;
            color: #888888;
            margin-bottom: 50px;
            font-weight: 400;
            min-height: 22px;
        }

        /* Flat button formatting */
        .btn {
            background-color: var(--text-color);
            color: var(--bg-color);
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .hidden {
            display: none !important;
        }

        /* Controller Layout Grid */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .span-2 {
            grid-column: span 2;
        }

        .btn-remote {
            padding: 25px;
            font-size: 20px;
            border-radius: 12px;
        }

        .btn-danger {
            background-color: transparent;
            color: var(--error-color);
            border: 2px solid var(--error-color);
        }
    </style>
</head>
<body>

    <div id="sync-screen" class="card">
        <div class="title">Syncing</div>
        <div id="sync-status" class="status">Connecting to Discord channel...</div>
    </div>

    <div id="remote-screen" class="card hidden">
        <div class="title" style="font-size: 32px; margin-bottom: 5px;">Remote Active</div>
        <div id="remote-status" class="status" style="color: var(--success-color);">Connected</div>
        
        <div class="grid">
            <button class="btn btn-remote span-2" onclick="sendRemoteCommand('next')">NEXT SLIDE</button>
            <button class="btn btn-remote" onclick="sendRemoteCommand('previous')">PREVIOUS</button>
            <button class="btn btn-remote btn-danger" onclick="sendRemoteCommand('blackout')">Blackout</button>
        </div>
    </div>

    <script>
        // ================= CONFIGURATION =================
        // 1. Replace with your computer's static local IP on the church network
        const COMPUTER_IP = "http://192.168.1.100"; 
        
        // 2. Paste your entire Discord Webhook URL here (Safe to leave public on GitHub)
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1515395624143425677/fMSyb5HE-fQcbRhZdtEGxo2Tz9md5jtm684dkRq7x_56jgfirKK4_w3oWPD4IUj7Y8_l";
        // =================================================

        let targetTargetUrl = "";

        async function syncRemoteWithWebhook() {
            const syncStatus = document.getElementById('sync-status');
            
            try {
                // Fetch Webhook meta info natively bypassing cross-origin browser limits
                const response = await fetch(DISCORD_WEBHOOK_URL);
                if (!response.ok) throw new Error("Webhook verification failed");

                const webhookData = await response.json();
                
                // Read the channel info straight from the webhook name string
                let rawContent = webhookData.name; 

                // Scan the string for a valid 4-to-5 digit active target port
                const portMatch = rawContent.match(/\d{4,5}/);

                if (portMatch) {
                    const detectedPort = portMatch[0];
                    targetTargetUrl = `${COMPUTER_IP}:${detectedPort}/api/remote`;
                    
                    // Display the live interactive remote
                    document.getElementById('sync-screen').classList.add('hidden');
                    document.getElementById('remote-screen').classList.remove('hidden');
                    document.getElementById('remote-status').innerText = `Synced to Local Port ${detectedPort}`;
                } else {
                    syncStatus.innerText = "Presentation application is offline. Waiting for sync payload...";
                }

            } catch (err) {
                console.error(err);
                syncStatus.innerText = "Sync failed. Check your Webhook URL properties.";
                syncStatus.style.color = "var(--error-color)";
            }
        }

        function sendRemoteCommand(action) {
            const rStatus = document.getElementById('remote-status');
            
            fetch(targetTargetUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: action })
            })
            .then(res => {
                if (res.ok) {
                    rStatus.innerText = `Sent: ${action.toUpperCase()}`;
                    rStatus.style.color = "var(--text-color)";
                    
                    setTimeout(() => {
                        rStatus.innerText = "Connected";
                        rStatus.style.color = "var(--success-color)";
                    }, 1000);
                }
            })
            .catch(() => {
                rStatus.innerText = "App unreachable on local church network";
                rStatus.style.color = "var(--error-color)";
            });
        }

        // Kick off sync automatically when page is loaded on mobile
        window.onload = syncRemoteWithWebhook;
    </script>
</body>
</html>
