<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord-Synced Remote</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --error-color: #ff6b6b;
            --success-color: #2ecc71;
        }

        body {
            font-family: system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .card {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .title {
            font-size: 36px;
            font-weight: 500;
            margin-bottom: 30px;
        }

        .status {
            font-size: 16px;
            color: #888888;
            margin-bottom: 40px;
        }

        .btn {
            background-color: var(--text-color);
            color: var(--bg-color);
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .span-2 { grid-column: span 2; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="sync-screen" class="card">
        <div class="title">Syncing Remote</div>
        <div id="sync-status" class="status">Fetching latest port from Discord...</div>
    </div>

    <div id="remote-screen" class="card hidden">
        <div class="title" style="font-size: 28px; margin-bottom: 10px;">Remote Active</div>
        <div id="remote-status" class="status" style="color: var(--success-color);">Connected</div>
        
        <div class="grid">
            <button class="btn span-2" onclick="sendCommand('next')">NEXT SLIDE</button>
            <button class="btn" onclick="sendCommand('previous')">PREVIOUS</button>
            <button class="btn" style="background-color: transparent; color: var(--error-color); border: 2px solid var(--error-color);" onclick="sendCommand('blackout')">Blackout</button>
        </div>
    </div>

    <script>
        // CONFIGURATION
        // Replace with your computer's static local IP on the church network
        const COMPUTER_IP = "http://192.168.1.100"; 
        
        // Your Discord Bot Token and Channel ID where the app posts the port
        const DISCORD_CHANNEL_ID = "1515388197712957603";
        const DISCORD_BOT_TOKEN = "MTUwOTY1MTk2MTQyMTYzMTUzOA.GCzV39.GCJw41kMXsE1RBybauQ3NNxH8unTACq7tsTOOQ";

        let targetTargetUrl = "";

        // Automatically run on page load
        async function fetchPortFromDiscord() {
            const syncStatus = document.getElementById('sync-status');
            
            try {
                // Fetch the last 1 message from your private Discord channel
                const response = await fetch(`https://discord.com/api/v10/channels/${DISCORD_CHANNEL_ID}/messages?limit=1`, {
                    headers: {
                        "Authorization": `Bot ${DISCORD_BOT_TOKEN}`
                    }
                });

                if (!response.ok) throw new Error("Failed to read Discord channel");

                const messages = await response.json();
                if (messages.length === 0) {
                    syncStatus.innerText = "Channel is empty. Start your app first.";
                    syncStatus.style.color = "var(--error-color)";
                    return;
                }

                const latestMessage = messages[0].content; // Expected format: "PORT:XXXX"
                
                // Match and extract a 4 or 5 digit number from the text
                const portMatch = latestMessage.match(/\d{4,5}/);

                if (portMatch) {
                    const detectedPort = portMatch[0];
                    targetTargetUrl = `${COMPUTER_IP}:${detectedPort}/api/remote`;
                    
                    // Switch layouts automatically
                    document.getElementById('sync-screen').classList.add('hidden');
                    document.getElementById('remote-screen').classList.remove('hidden');
                    document.getElementById('remote-status').innerText = `Synced to Port ${detectedPort}`;
                } else {
                    syncStatus.innerText = "Could not find a valid port in the latest message.";
                    syncStatus.style.color = "var(--error-color)";
                }

            } catch (err) {
                console.error(err);
                syncStatus.innerText = "Error syncing with Discord.";
                syncStatus.style.color = "var(--error-color)";
            }
        }

        function sendCommand(action) {
            const rStatus = document.getElementById('remote-status');
            
            fetch(targetTargetUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: action })
            })
            .then(res => {
                if (res.ok) {
                    rStatus.innerText = `Sent: ${action.toUpperCase()}`;
                    rStatus.style.color = "var(--text-color)";
                }
            })
            .catch(() => {
                rStatus.innerText = "App unreachable on local network";
                rStatus.style.color = "var(--error-color)";
            });
        }

        // Run the sync on startup
        window.onload = fetchPortFromDiscord;
    </script>
</body>
</html>
